name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag, package version and release notes
        run: python3 packaging/check-release.py "$GITHUB_REF_NAME"

  build:
    needs: validate
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the native packages' declared glibc 2.39 baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
            pe-machine: 8664 machine \(x64\)
            package-target: windows-amd64
          # A native arm64 runner, as for Linux: the binary is built, checked
          # and started on the processor it ships for, MilkDrop included.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
            pe-machine: AA64 machine \(ARM64\)
            package-target: windows-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows'
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      # projectm-sys asks CMake for the Visual Studio generator, which the
      # runner image no longer satisfies; Ninja inside the MSVC environment
      # builds the same thing without caring which Visual Studio is on. Both
      # Windows jobs also use dumpbin below to inspect the finished binary.
      # The action sets up x64 tools unless told otherwise, which on the arm64
      # runner would compile under emulation.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --locked --release --bin sonicfast --target ${{ matrix.target }}

      # The zip and installer must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\sonicfast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Sonicfast imports an MSVC runtime:`n$runtime" }
          # Verify that each artifact actually matches its declared processor.
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') { throw "$binary is not built for ${{ matrix.target }}:`n$headers" }
          # Each Windows build runs on its own processor: start it once.
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^sonicfast \d+\.\d+\.\d+') { throw "Unexpected --version output: $version" }

      - name: Package
        shell: bash
        run: |
          name="sonicfast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/sonicfast.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/sonicfast" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cp packaging/sonicfast-portable.txt "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents packaging/applications/sonicfast.desktop packaging/icons/sonicfast.svg "dist/$name/"
            cp --parents contrib/omarchy/sonicfast.json.tpl contrib/omarchy/sonicfast-theme "dist/$name/"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # Linux packages use the archive just built from this tag.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '4.0'
      - name: Install nFPM
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-nfpm.sh
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zsync
          gem install native-packages --version 0.10.0 --no-document
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) id=appimage-amd64; distro=linux-amd64 ;;
            aarch64-unknown-linux-gnu) id=appimage-arm64; distro=linux-arm64 ;;
            *) echo "No AppImage target for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          native-packages build --version "${GITHUB_REF_NAME#v}" --target "$id" --target "$distro" --defer-recipes \
            --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage \
            "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage.zsync dist/
          cp "$RUNNER_TEMP/appimage/packages/$distro/deb/"*.deb "dist/sonicfast-${GITHUB_REF_NAME}-$distro.deb"
          cp "$RUNNER_TEMP/appimage/packages/$distro/rpm/"*.rpm "dist/sonicfast-${GITHUB_REF_NAME}-$distro.rpm"

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\sonicfast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\sonicfast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Build the MSI from the same Sonicfast binary as the ZIP/setup program.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Windows'
        with:
          ruby-version: '4.0'
      - name: Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.10.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\sonicfast.exe", "README.md", "LICENSE", "packaging\windows\sonicfast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  macos:
    needs: validate
    name: macOS universal app
    runs-on: macos-latest
    env:
      # Complete Apple credentials enable native-packages signing/notarization.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # No compiler cache, as in the build job above.
      - name: Build both architectures
        run: |
          cargo build --locked --release --bin sonicfast --target aarch64-apple-darwin
          cargo build --locked --release --bin sonicfast --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/sonicfast \
            target/x86_64-apple-darwin/release/sonicfast \
            -output universal/sonicfast

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.10.0 --no-document

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/sonicfast dist/macos-input/Sonicfast.app "$version"
          cp README.md LICENSE dist/macos-input/

      - name: Package, sign and notarize macOS app
        run: |
          native-packages build \
            --version "${GITHUB_REF_NAME#v}" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle: the same binary, in the
  # sandbox packaging/flatpak describes, so nothing compiles twice. Flathub
  # builds from source on its own machines, from the manifest beside it.
  flatpak:
    name: Flatpak bundle
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf dist/sonicfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C packaging/flatpak "sonicfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mv packaging/flatpak/sonicfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/org.sonicfast.Sonicfast.bundle.yml
          bundle: sonicfast-${{ github.ref_name }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: GitHub release
    # The bundle is welcome but not required: a Flatpak failure must not
    # hold the release.
    needs: [build, macos, flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Include the source package so source distributions can verify it
      # against the same published checksums as the binaries.
      - name: Source archive
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
            --output "dist/sonicfast-${GITHUB_REF_NAME}-source.tar.gz"
      - name: Verify release artifacts and write checksums
        run: python3 packaging/release-names.py dist "$GITHUB_REF_NAME"
      # The default client has no self-updater. Do not sign with or require
      # the inherited upstream key. Configure a fork-owned trust root before
      # adding signed update manifests in a future change.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Sonicfast ${{ github.ref_name }}
          # Publish reviewed notes immediately, not a generated PR-only summary.
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # A tag with a suffix (v0.4.0-rc1) is a pre-release: it stays
          # off "latest", so manual downloads distinguish preview builds.
          prerelease: ${{ contains(github.ref_name, '-') }}
