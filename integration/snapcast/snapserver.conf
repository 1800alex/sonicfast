[server]
threads = 2
datadir = /state
[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705
[stream]
bind_to_address = 0.0.0.0
port = 1704
source = tcp://0.0.0.0:4953?name=Sonicfast&mode=server&sampleformat=44100:16:2&codec=flac&chunk_ms=20
buffer = 1000
chunk_ms = 20
codec = flac
send_to_muted = true
[logging]
filter = *:warning
