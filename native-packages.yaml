# Shared CLI: gem install native-packages --version 0.10.0
---
schema: 1
tool:
  version: 0.10.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the ALSA t64 package name. Override ELF
# inference as well as the explicit dependencies below.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
  libpipewire-0.3.so.0:
    deb: libpipewire-0.3-0t64 | libpipewire-0.3-0
    rpm: pipewire-libs
nfpm:
  name: sonicfast
  maintainer: Sonicfast contributors
  homepage: https://github.com/1800alex/sonicfast
  description: A native OpenSubsonic music client
  license: MIT
  contents:
  # A glob source makes nFPM append its basename to the destination directory.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/sonicfast"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/sonicfast/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/sonicfast/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/applications/*.desktop"
    dst: "/usr/share/applications/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/icons/*.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/"
    file_info:
      mode: 420
  - src: contrib/omarchy/sonicfast.json.tpl
    dst: /usr/share/sonicfast/omarchy/sonicfast.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/sonicfast-theme
    dst: /usr/share/sonicfast/omarchy/sonicfast-theme
    file_info:
      mode: 493
  overrides:
    # ELF inspection cannot discover the GUI's dlopen dependencies. Keep
    # these aligned with winit/glutin/rfd and packaging/check-runtime-libs.c.
    deb:
      depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pipewire-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'sonicfast-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/sonicfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: sonicfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/sonicfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: sonicfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  # AppImages carry fork-owned update metadata for external AppImage tools.
  # Sonicfast's in-app updater remains disabled.
  appimage-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats: [appimage]
    appimage:
      update_information: gh-releases-zsync|1800alex|sonicfast|latest|sonicfast-*-x86_64.AppImage.zsync
    input:
      local: dist/sonicfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: sonicfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  appimage-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats: [appimage]
    appimage:
      update_information: gh-releases-zsync|1800alex|sonicfast|latest|sonicfast-*-aarch64.AppImage.zsync
    input:
      local: dist/sonicfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: sonicfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  # Windows Installer packages, built on each Windows release runner from the
  # binary it built; the input folder holds what the package installs.
  windows-amd64:
    platform: windows
    arch: amd64
    compiler_target: x86_64-pc-windows-msvc
    formats: [msi]
    input:
      kind: directory
      local: dist/msi-input-x86_64-pc-windows-msvc
    native:
      command: [python, packaging/windows/build-msi.py, '@PAYLOAD@', '@PACKAGE@', '@VERSION@', '@ARCH@']
      output: 'sonicfast-@TAG@-@TARGET@.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    compiler_target: aarch64-pc-windows-msvc
    formats: [msi]
    input:
      kind: directory
      local: dist/msi-input-aarch64-pc-windows-msvc
    native:
      command: [python, packaging/windows/build-msi.py, '@PAYLOAD@', '@PACKAGE@', '@VERSION@', '@ARCH@']
      output: 'sonicfast-@TAG@-@TARGET@.msi'
release:
  repository: 1800alex/sonicfast
  prereleases: true
  checksums: checksums.txt
assets:
  AMD64:
    file: sonicfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/sonicfast-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: sonicfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/sonicfast-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: sonicfast-v@VERSION@-source.tar.gz
    local: dist/sonicfast-v@VERSION@-source.tar.gz
  MACOS:
    file: sonicfast-v@VERSION@-macos-universal.dmg
    local: dist/sonicfast-v@VERSION@-macos-universal.dmg
templates:
  arch/sonicfast/PKGBUILD: packaging/arch/sonicfast/PKGBUILD.in
  arch/sonicfast/sonicfast.install: packaging/arch/sonicfast.install
  arch/sonicfast-bin/PKGBUILD: packaging/arch/sonicfast-bin/PKGBUILD.in
  arch/sonicfast-bin/sonicfast-bin.install: packaging/arch/sonicfast.install
  arch/sonicfast-git/PKGBUILD: packaging/arch/sonicfast-git/PKGBUILD.in
  arch/sonicfast-git/sonicfast-git.install: packaging/arch/sonicfast.install
  homebrew/sonicfast.rb: packaging/homebrew/sonicfast.rb.in
version_file: Cargo.toml
